<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma Musique</title>
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Ma Musique</h1>
    <input id="search" type="search" placeholder="Rechercher un album…" autocomplete="off">
    <button id="change-folder" class="link hidden" title="Choisir un autre dossier de musique">📁 <span>Changer de dossier</span></button>
  </header>

  <main>
    <section id="welcome" class="welcome hidden">
      <img src="icon.svg" width="96" height="96" alt="">
      <h2>Bienvenue !</h2>
      <p>Choisis le dossier qui contient ta musique.<br>Chaque sous-dossier sera un album.</p>
      <button id="resume" class="btn hidden"></button>
      <button id="pick" class="btn">📁 Choisir mon dossier de musique</button>
      <p class="note">Tes fichiers restent sur ton appareil : rien n'est envoyé sur internet.</p>
      <input id="dir-input" type="file" webkitdirectory multiple hidden>
    </section>
    <p id="loading" class="loading hidden">Lecture de la bibliothèque…</p>
    <section id="grid" class="grid"></section>

    <aside id="panel" class="panel hidden">
      <div class="panel-head">
        <div id="panel-cover" class="cover"></div>
        <div class="panel-info">
          <h2 id="panel-title"></h2>
          <p id="panel-count"></p>
          <button id="panel-play" class="btn">▶ Lire l'album</button>
        </div>
        <button id="panel-close" class="icon" title="Fermer">✕</button>
      </div>
      <ol id="tracklist" class="tracklist"></ol>
    </aside>
  </main>

  <footer class="player">
    <div class="now">
      <div id="now-cover" class="cover small"></div>
      <div class="now-text">
        <div id="now-title">Aucune lecture</div>
        <div id="now-album"></div>
      </div>
    </div>
    <div class="controls">
      <div class="buttons">
        <button id="prev" class="icon" title="Précédent">⏮</button>
        <button id="play" class="icon big" title="Lecture / Pause">▶</button>
        <button id="next" class="icon" title="Suivant">⏭</button>
      </div>
      <div class="seek">
        <span id="cur">0:00</span>
        <input id="progress" type="range" min="0" max="1000" value="0">
        <span id="dur">0:00</span>
      </div>
    </div>
    <div class="volume">
      🔊 <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
    </div>
  </footer>

  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
